<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="payment-container">
        <h2>Payment Details</h2>
        
        <form id="payment-form" action="#" method="POST">
            <!-- Card Information -->
            <label for="card-number">Card Number:</label>
            <input type="text" id="card-number" name="card-number" placeholder="1234 5678 9012 3456" required>
            
            <label for="card-name">Cardholder's Name:</label>
            <input type="text" id="card-name" name="card-name" placeholder="John Doe" required>
            
            <label for="expiry-date">Expiry Date:</label>
            <input type="month" id="expiry-date" name="expiry-date" required>
            
            <label for="cvv">CVV:</label>
            <input type="text" id="cvv" name="cvv" placeholder="123" required>
            
            <!-- Billing Information -->
            <label for="billing-address">Billing Address:</label>
            <input type="text" id="billing-address" name="billing-address" placeholder="123 Main St" required>
            
            <!-- Payment Button -->
            <button type="submit" class="btn-submit">Pay Now</button>
        </form>
        
        <div class="payment-status" id="payment-status"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
